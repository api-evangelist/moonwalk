name: Moonwalk Biosciences
description: >-
  Moonwalk Biosciences is a biotechnology company pioneering therapeutics in
  adipose (fat) biology, driven by deep genetic and epigenetic insights. Co-founded
  by Alex Aravanis (CEO), Arash Jamshidi (President & CTO), Justin Valley (Chief
  Platform Officer), and CRISPR pioneer Feng Zhang, the company develops epigenetic
  and siRNA-based programs — including obesity therapies — and is backed by Khosla
  Ventures, ARCH Venture Partners, Google Ventures, Future Ventures, Alpha Wave
  Global, and YK Bioventures. Moonwalk does not currently publish a public developer
  program, API, or API documentation; this profile captures its corporate identity
  and web presence in the API Evangelist network.
